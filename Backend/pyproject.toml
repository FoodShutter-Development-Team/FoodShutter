[project]
name = "food-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.74.0",
    "pillow>=11.0.0",
    "ollama>=0.4",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "fastapi[standard]>=0.115",
    "supabase>=2.10",
    "PyJWT>=2.9",
    "python-dotenv>=1.0",
    "openai>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "matplotlib>=3.10.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pipeline", "api", "nutrition_db"]
omit = ["*/scripts/*", "*/Finetune/*", "*/tests/*"]
